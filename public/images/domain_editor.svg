<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="400" height="400" rx="40" fill="#F3F4F6"/>

  <!-- 상단 앱 아이콘 4개 -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="60" height="70" rx="12" fill="url(#blueGrad)"/>
    <circle cx="20" cy="25" r="10" fill="#F3F4F6"/>
    <rect x="18" y="43" width="24" height="6" rx="3" fill="#EFF6FF"/>

    <rect x="80" y="0" width="60" height="70" rx="12" fill="#10B981"/>
    <rect x="92" y="20" width="36" height="8" rx="4" fill="#ECFEFF"/>
    <rect x="92" y="36" width="26" height="8" rx="4" fill="#ECFEFF"/>

    <rect x="160" y="0" width="60" height="70" rx="12" fill="#F97316"/>
    <path d="M175 18 L209 35 L175 52 Z" fill="#FEF2F2"/>

    <rect x="240" y="0" width="60" height="70" rx="12" fill="#7C3AED"/>
    <rect x="252" y="18" width="36" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="252" y="34" width="36" height="8" rx="4" fill="#EDE9FE"/>
    <rect x="252" y="50" width="24" height="8" rx="4" fill="#EDE9FE"/>

    <!-- 커넥터 라인 -->
    <g stroke="#CBD5F5" stroke-width="4" fill="none">
      <line x1="30" y1="70" x2="30" y2="110"/>
      <line x1="110" y1="70" x2="110" y2="110"/>
      <line x1="190" y1="70" x2="190" y2="110"/>
      <line x1="270" y1="70" x2="270" y2="110"/>
      <line x1="30" y1="110" x2="270" y2="110"/>
    </g>
  </g>

  <!-- 메인 브라우저 창 -->
  <g transform="translate(60,130)">
    <rect x="0" y="0" width="280" height="170" rx="18" fill="url(#blueGrad)"/>
    <rect x="12" y="14" width="18" height="6" rx="3" fill="#EFF6FF"/>
    <circle cx="260" cy="17" r="4" fill="#EFF6FF"/>
    <rect x="40" y="60" width="80" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="40" y="78" width="120" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="40" y="96" width="90" height="6" rx="3" fill="#DBEAFE"/>
    <polygon points="150,55 195,90 105,90" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- 그리드 패널 -->
  <g transform="translate(50,230)">
    <rect x="0" y="0" width="140" height="110" rx="14" fill="#10B981"/>
    <path d="M0 24 H140 M0 48 H140 M0 72 H140 M0 96 H140" stroke="#A7F3D0" stroke-width="2" opacity="0.7"/>
    <path d="M28 0 V110 M56 0 V110 M84 0 V110 M112 0 V110" stroke="#A7F3D0" stroke-width="2" opacity="0.7"/>
    <polygon points="18,80 46,92 28,60" fill="#0F766E"/>
  </g>

  <!-- 작은 차트 타일 -->
  <g transform="translate(240,250)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#EFF6FF"/>
    <circle cx="50" cy="50" r="28" fill="none" stroke="#CBD5F5" stroke-width="8"/>
    <path d="M50 22 A28 28 0 1 1 30 34" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  </g>
