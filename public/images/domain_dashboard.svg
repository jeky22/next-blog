<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="400" height="400" rx="40" fill="#F3F4F6"/>

  <!-- 상단 큰 카드: 라인 + 바 -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="320" height="170" rx="20" fill="url(#cardGrad)"/>
    <!-- 회색 바들 -->
    <g transform="translate(20,40)" fill="#E5E7EB">
      <rect x="0" y="60" width="10" height="40" rx="3"/>
      <rect x="18" y="40" width="10" height="60" rx="3"/>
      <rect x="36" y="30" width="10" height="70" rx="3"/>
      <rect x="54" y="55" width="10" height="45" rx="3"/>
      <rect x="72" y="25" width="10" height="75" rx="3"/>
      <rect x="90" y="50" width="10" height="50" rx="3"/>
      <rect x="108" y="35" width="10" height="65" rx="3"/>
      <rect x="126" y="45" width="10" height="55" rx="3"/>
      <rect x="144" y="20" width="10" height="80" rx="3"/>
      <rect x="162" y="60" width="10" height="40" rx="3"/>
      <rect x="180" y="48" width="10" height="52" rx="3"/>
      <rect x="198" y="30" width="10" height="70" rx="3"/>
    </g>
    <!-- 라인 차트 -->
    <polyline
      points="20,100 40,80 58,60 76,90 94,55 112,70 130,58 148,62 166,45 184,75 202,65 220,50"
      fill="none"
      stroke="#F97316"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- 상단 작은 헤더 바 -->
    <rect x="20" y="20" width="70" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="100" y="20" width="40" height="8" rx="4" fill="#E5E7EB"/>
  </g>

  <!-- 하단 왼쪽 카드: 도넛 차트 -->
  <g transform="translate(40,230)">
    <rect x="0" y="0" width="150" height="130" rx="18" fill="url(#cardGrad)"/>
    <circle cx="60" cy="65" r="36" fill="none" stroke="#E5E7EB" stroke-width="10"/>
    <path d="M60 29 A36 36 0 0 1 92 77" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="60" cy="65" r="18" fill="#FFFFFF"/>
    <rect x="110" y="32" width="26" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="110" y="50" width="30" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="110" y="68" width="22" height="6" rx="3" fill="#E5E7EB"/>
  </g>

  <!-- 하단 오른쪽 카드: 막대 그래프 -->
  <g transform="translate(210,230)">
    <rect x="0" y="0" width="150" height="130" rx="18" fill="url(#cardGrad)"/>
    <line x1="30" y1="100" x2="120" y2="100" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="32" y="70" width="18" height="30" rx="4" fill="#BFDBFE"/>
    <rect x="60" y="55" width="18" height="45" rx="4" fill="#60A5FA"/>
    <rect x="88" y="40" width="18" height="60" rx="4" fill="#1D4ED8"/>
    <rect x="116" y="25" width="18" height="75" rx="4" fill="#0EA5E9"/>
    <!-- 헤더 바 -->
    <rect x="20" y="18" width="60" height="8" rx="4" fill="#E5E7EB"/>
  </g>
</svg>
